name: Publish 15 journal posts daily

on:
  schedule:
    # 19:30 UTC = 22:30 Moscow; one block of 15 editorial posts.
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate a new card without posting to Telegram'
        type: boolean
        default: true
      publish_now:
        description: 'Publish today’s block immediately, preserving its daily limit'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: journal-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install server dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Test duplicate protection and caption validation
        run: python3 -m unittest discover -s cloud -p 'test_*.py'
      - name: Publish or validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_NOW: ${{ github.event.inputs.publish_now || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 cloud/publish.py --dry-run
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH_NOW" = "true" ]; then
            python3 cloud/publish.py --publish-now
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python3 cloud/publish.py --scheduled
          else
            python3 cloud/publish.py
          fi
